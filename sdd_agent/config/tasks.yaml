# Etapas executadas em sequência, uma de cada vez (cada uma pode ser repetida
# sozinha se o modelo falhar). Marcadores [[NOME]] são substituídos em Python;
# não usamos chaves para não conflitar com CSS/JS dentro das specs.
# [[REGRAS_TECNICAS]] vem de config/regras_tecnicas.md e é o MESMO texto para
# a versão SDD e a versão em linguagem natural.

analisar:
  agent: analista
  description: >
    Analise a especificação como fonte da verdade e produza um plano conciso,
    completo e priorizado. Não implemente nem acrescente requisitos.

    1. Identifique todos os requisitos verificáveis, agrupe apenas duplicatas e
       preserve os IDs fornecidos. Crie IDs RF-01, RF-02... somente para requisitos
       sem identificador; não limite a lista aos cinco primeiros.
    2. Para cada requisito, registre prioridade e um critério de aceitação observável.
    3. Resuma os dados, fluxos e componentes diretamente necessários aos requisitos.
    4. Proponha uma estrutura de arquivos pequena e compatível com as restrições
       explícitas da especificação.
    5. Separe ambiguidades, conflitos e decisões mínimas; não trate decisões como
       requisitos confirmados.

    ===== ESPECIFICAÇÃO ([[ARQUIVO]]) =====
    [[SPEC]]
    ===== FIM DA ESPECIFICAÇÃO =====
  expected_output: >
    Plano Markdown conciso com requisitos (ID, prioridade, descrição, critério),
    dados e fluxos necessários, estrutura de arquivos, ambiguidades/conflitos e
    decisões mínimas claramente identificadas.

implementar:
  agent: desenvolvedor
  description: >
    Implemente a aplicação completa em uma única resposta, seguindo a
    especificação e o plano técnico abaixo. A especificação prevalece em caso de
    conflito. Cubra todos os requisitos e critérios de aceitação; não adicione
    funcionalidades que não foram pedidas.

    [[REGRAS_TECNICAS]]

    No campo relatorio, liste brevemente onde cada requisito foi implementado.

    ===== ESPECIFICAÇÃO =====
    [[SPEC]]
    ===== PLANO TÉCNICO =====
    [[PLANO]]
    ===== FIM =====
  expected_output: >
    Objeto com a lista de arquivos (caminho relativo e conteúdo completo), o
    arquivo de entrada (index.html) e um relatório curto requisito -> código.

gerar_natural:
  agent: desenvolvedor
  description: >
    Implemente a aplicação completa em uma única resposta, a partir do pedido do
    usuário abaixo. Atenda a tudo o que foi pedido; não adicione funcionalidades
    que não foram pedidas.

    [[REGRAS_TECNICAS]]

    No campo relatorio, resuma brevemente o que foi implementado e as decisões tomadas.

    ===== PEDIDO DO USUÁRIO =====
    [[PROMPT]]
    ===== FIM =====
  expected_output: >
    Objeto com a lista de arquivos (caminho relativo e conteúdo completo), o
    arquivo de entrada (index.html) e um relatório curto do que foi implementado.

revisar:
  # Opcional (--revisar). Quando ligado, roda nas DUAS versões com o mesmo texto;
  # cada uma é revisada contra a sua própria entrada (spec ou pedido natural).
  agent: revisor
  description: >
    Faça revisão independente da implementação contra o pedido recebido.
    Preserve comportamento correto, corrija somente defeitos verificáveis e evite
    reescrever arquivos sem necessidade.

    - Verifique ponto de entrada, integridade dos arquivos, sintaxe aparente,
      ordem dos scripts e referências locais.
    - Confronte cada item do pedido com evidência concreta no código.
    - Corrija problemas confirmados sem alterar o que foi pedido.
    - Devolva todos os arquivos finais completos e liste as correções feitas.

    [[REGRAS_TECNICAS]]

    ===== PEDIDO =====
    [[SPEC]]
    ===== CÓDIGO A REVISAR =====
    [[CODIGO]]
    ===== FIM =====
  expected_output: >
    Objeto com a lista de arquivos finais (caminho relativo e conteúdo
    completo), o arquivo de entrada (index.html) e a lista de correções feitas.

avaliar:
  # Ferramenta à parte (--avaliar): audita E CORRIGE uma geração. Não faz parte
  # do experimento; usá-la em só uma das versões invalida a comparação.
  agent: avaliador
  description: >
    Faça uma auditoria técnica com escopo limitado aos arquivos e ao contexto
    fornecidos. Corrija apenas defeitos confirmados, preservando código e UX
    válidos; não faça refatorações amplas.

    Ordene a análise: bloqueio de inicialização/fluxo principal; requisitos e
    comportamento; segurança e integridade de dados; acessibilidade e
    responsividade; manutenção e performance.

    ===== TIPO DA GERAÇÃO =====
    [[TIPO_AVALIACAO]]

    Para cada achado confirmado, registre severidade (CRÍTICA/ALTA/MÉDIA/BAIXA),
    arquivo/linha, evidência, impacto e correção aplicada. Não escreva “testado”
    ou “aprovado” sem comprovação. Devolva todos os arquivos afetados completos
    e preserve caminhos originais.

    ===== ESPECIFICAÇÃO/PEDIDO =====
    [[ESPECIFICACAO]]
    ===== CÓDIGO =====
    [[CODIGO]]
    ===== FIM =====
    Entregue `index.html` na lista de arquivos, mesmo que ele não precise de
    alteração. Não invente arquivos de dependência.
  expected_output: >
    Objeto estruturado com arquivos afetados completos, index.html como entrada e
    relatório Markdown em português com achados por severidade, evidência,
    impacto e correções aplicadas.

comparar:
  agent: avaliador
  description: >
    Avalie, às cegas, duas implementações ("Versão A" e "Versão B") da MESMA
    aplicação. Você não sabe como cada uma foi produzida. Use a especificação de
    referência abaixo como gabarito comum e aplique exatamente os mesmos
    critérios às duas versões. Não modifique código.

    1. Liste os requisitos verificáveis da especificação de referência (use os
       IDs dela quando existirem). Para cada requisito, dê o status em cada
       versão — ATENDIDO, PARCIAL ou NÃO ATENDIDO — com evidência em arquivo e
       linha. Sem evidência no código, não marque ATENDIDO.
    2. Calcule, para cada versão, a cobertura: ATENDIDO = 1, PARCIAL = 0,5,
       NÃO ATENDIDO = 0; informe o total e o percentual.
    3. Dê nota de 0 a 10, para cada versão, em: corretude funcional, cobertura
       de requisitos, regras de negócio e validações, tratamento de erros,
       acessibilidade, responsividade, segurança, organização/manutenibilidade.
       Justifique cada nota em uma linha.
    4. Considere as métricas objetivas fornecidas (testes automáticos no
       navegador e tamanho do código) como evidência adicional.
    5. Liste os defeitos mais graves de cada versão, por severidade.
    6. Conclua indicando qual versão atende melhor à especificação e por quê,
       ou declare empate se a diferença não for significativa.

    ===== ESPECIFICAÇÃO DE REFERÊNCIA =====
    [[REFERENCIA]]
    ===== MÉTRICAS OBJETIVAS =====
    [[METRICAS]]
    ===== VERSÃO A =====
    [[CODIGO_A]]
    ===== VERSÃO B =====
    [[CODIGO_B]]
    ===== FIM =====
  expected_output: >
    Apenas um relatório Markdown com: matriz requisito x versão (status e
    evidência), cobertura por versão, tabela de notas por critério, defeitos
    graves por versão e conclusão. Refira-se às versões apenas como A e B.
