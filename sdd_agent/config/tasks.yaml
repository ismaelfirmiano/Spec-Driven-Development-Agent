# Etapas executadas em sequência, uma de cada vez (cada uma pode ser repetida
# sozinha se o modelo falhar). Marcadores [[NOME]] são substituídos em Python;
# não usamos chaves para não conflitar com CSS/JS dentro das specs.

analisar:
  agent: analista
  description: >
    Leia a especificação abaixo e produza um plano técnico.

    1. Liste cada requisito funcional como RF-01, RF-02, ... e cada requisito
       não funcional como RNF-01, ... Se a spec já tiver IDs, preserve-os.
    2. Para cada requisito, escreva um critério de aceitação verificável.
    3. Descreva a estrutura de arquivos (por padrão index.html, style.css e
       script.js), o modelo de dados e os componentes de interface.
    4. Liste ambiguidades e a decisão mínima adotada para cada uma.

    ===== ESPECIFICAÇÃO ([[ARQUIVO]]) =====
    [[SPEC]]
    ===== FIM DA ESPECIFICAÇÃO =====
  expected_output: >
    Plano técnico em Markdown com: tabela de requisitos (ID, descrição,
    critério de aceitação), estrutura de arquivos, modelo de dados,
    componentes de UI e ambiguidades resolvidas.

implementar:
  agent: desenvolvedor
  description: >
    Implemente a aplicação completa seguindo o plano técnico abaixo.

    Regras:
    - Deve abrir com duplo clique em index.html (protocolo file://): nada de
      módulos ES, fetch de arquivos locais, build ou servidor.
    - Apenas HTML, CSS e JavaScript puro; bibliotecas externas só se a spec
      pedir, e então via CDN.
    - Comente no código o ID do requisito implementado (ex.: // RF-03).
    - Código completo, sem "TODO" nem trechos omitidos.
    - No campo relatorio, liste brevemente onde cada requisito foi implementado.

    ===== PLANO TÉCNICO =====
    [[PLANO]]
    ===== FIM DO PLANO =====
  expected_output: >
    Objeto com a lista de arquivos (caminho relativo e conteúdo completo), o
    arquivo de entrada (index.html) e um relatório curto requisito -> código.

revisar:
  agent: revisor
  description: >
    Revise o código abaixo contra o plano técnico e a especificação original.

    1. Para cada requisito, diga se foi atendido e onde no código.
    2. Corrija bugs e requisitos faltantes diretamente no código.
    3. Devolva a versão FINAL e COMPLETA de todos os arquivos, mais um
       relatório de rastreabilidade em Markdown.

    ===== ESPECIFICAÇÃO ORIGINAL =====
    [[SPEC]]
    ===== PLANO TÉCNICO =====
    [[PLANO]]
    ===== CÓDIGO A REVISAR =====
    [[CODIGO]]
    ===== FIM =====
  expected_output: >
    Objeto com a lista de arquivos finais (caminho relativo e conteúdo
    completo), o arquivo de entrada (index.html) e o relatório de
    rastreabilidade requisito -> código -> status.

gerar_natural:
  agent: interpretador
  description: >
    Crie uma aplicação web pequena diretamente a partir do pedido.

    Prefira a versão mais simples que funcione. Use apenas index.html, style.css
    e script.js, salvo quando o pedido exigir outra estrutura clara.

    Regras:
    - Entregue HTML, CSS e JavaScript completo em arquivos separados.
    - Não use SDD, plano técnico SDD, rastreabilidade formal ou backend.
    - O arquivo index.html deve abrir diretamente pelo navegador.
    - Use dados fictícios claramente identificados quando necessário.
    - Use JavaScript ES6+, localStorage quando persistência fizer sentido e sem
      dependências externas desnecessárias.
    - Crie interface responsiva a partir de 320 px, com labels, teclado, foco visível
      e estados vazios/erro/sucesso compatíveis com o pedido.
    - Não omita implementações com TODO ou comentário de conteúdo pendente.
    - Faça estimativas visuais realistas, sem inventar integrações não pedidas.
    - No campo relatorio, liste o que foi interpretado do pedido, suas limitações
      e uma matriz de rastreabilidade leve com: ponto solicitado, implementação,
      arquivo/linha aproximada e status (atendido/parcial/não atendido).

    ===== PEDIDO DO USUÁRIO =====
    [[PROMPT]]
    ===== FIM =====
  expected_output: >
    Objeto com arquivos HTML/CSS/JS completos, arquivo de entrada index.html e
    relatório curto com decisões, limitações e matriz de rastreabilidade natural.

avaliar:
  agent: avaliador
  description: >
    Avalie o código e a documentação fornecidos abaixo. Não suponha execução,
    testes ou dependências que não estejam evidenciados. Corrija os problemas
    reais encontrados e devolva o conteúdo completo dos arquivos afetados.

    ===== TIPO DA GERAÇÃO =====
    [[TIPO_AVALIACAO]]

    Para uma geração SDD, verifique matriz de rastreabilidade, conformidade com
    especificação/plano, critérios de aceitação, testes planejados e realizados,
    regressões e qualidade técnica.

    Para uma geração de linguagem natural, use o pedido/documentação disponível
    como contexto. Não exigir rastreabilidade formal SDD. Verifique proximidade com
    o pedido, consistência visual, estados vazios/erro/sucesso, interações,
    persistência, responsividade, acessibilidade e limitações declaradas.

    Nos dois tipos, verifique arquitetura modular, separação de responsabilidades,
    legibilidade, tratamento de erros, segurança, prevenção de HTML/JS importado,
    compatibilidade de navegador e performance.

    Para cada achado use severidade (CRÍTICA/ALTA/MÉDIA/BAIXA), arquivo e linha
    aproximada, evidência concreta, impacto e correção aplicada. Não devolva apenas
    sugestões; devolva o arquivo completo já corrigido.

    ===== ESPECIFICAÇÃO/PLANO =====
    [[ESPECIFICACAO]]
    ===== CÓDIGO =====
    [[CODIGO]]
    ===== FIM =====
  expected_output: >
    Objeto com a versão corrigida completa dos arquivos afetados (caminho relativo
    e conteúdo), index.html como entrada e um relatório Markdown em português com
    resumo executivo, achados por severidade, evidências, correções aplicadas,
    requisitos verificados e gaps restantes.

    Quando o tipo for linguagem natural, inclua uma matriz de rastreabilidade
    leve: ponto solicitado, implementação encontrada, arquivo/linha, status
    (atendido/parcial/não atendido) e evidência. Não exigir IDs RF/RNF formais.

comparar:
  agent: avaliador
  description: >
    Compare as duas implementações abaixo. Considere o contexto SDD formal da
    primeira geração e o pedido direto da segunda, mas avalie ambos pelos mesmos
    critérios de engenharia de software: requisitos, modularidade, segurança,
    acessibilidade, responsividade, persistência, tratamento de erros, testes,
    documentação e manutenibilidade.

    Não declare superioridade sem evidência. Liste divergências por arquivo,
    severidade e impacto. Identifique o que o SDD possui e o natural não possui,
    e vice-versa. Corrija bugs apenas quando estiver claro em qual versão; não
    misture arquivos das duas gerações.

    ===== GERAÇÃO SDD =====
    [[CODIGO_SDD]]
    ===== GERAÇÃO LINGUAGEM NATURAL =====
    [[CODIGO_NATURAL]]
    ===== FIM =====
  expected_output: >
    Objeto com os arquivos completos corrigidos de ambas as versões, entrada
    index.html para cada comparação e um relatório Markdown com resumo comparativo,
    matriz lado a lado, requisitos/pontos atendidos, divergências, severidades,
    recomendações e conclusão técnica.
